<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compteur de jours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.5rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-12: 3rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
      --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
      --color-bg: #f7f6f2;
      --color-surface: #ffffff;
      --color-border: #d4d1ca;
      --color-text: #28251d;
      --color-muted: #6f6b63;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-success: #437a22;
      --color-warning: #964219;
      --color-error: #a12c7b;
    }

    [data-theme="dark"] {
      --color-bg: #171614;
      --color-surface: #1f1e1b;
      --color-border: #393836;
      --color-text: #eeece7;
      --color-muted: #a09c94;
      --shadow-md: 0 10px 30px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, var(--color-bg), #ece8e0);
      color: var(--color-text);
    }

    [data-theme="dark"] body {
      background: linear-gradient(180deg, var(--color-bg), #10100f);
    }

    .app {
      width: min(100%, 520px);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--space-8);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    h1 {
      margin: 0;
      font-size: var(--text-xl);
    }

    .muted {
      margin: var(--space-2) 0 0;
      color: var(--color-muted);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .theme-toggle {
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      border-radius: 999px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
    }

    form {
      display: grid;
      gap: var(--space-4);
      margin-top: var(--space-6);
    }

    .field {
      display: grid;
      gap: var(--space-2);
    }

    label {
      font-size: var(--text-sm);
      font-weight: 600;
    }

    input[type="date"] {
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      font-size: var(--text-base);
    }

    .actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      margin-top: var(--space-2);
    }

    button {
      border: none;
      border-radius: var(--radius-md);
      padding: 0.9rem 1.2rem;
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }

    .primary {
      background: var(--color-primary);
      color: white;
    }

    .primary:hover { background: var(--color-primary-hover); }

    .secondary {
      background: transparent;
      color: var(--color-text);
      border: 1px solid var(--color-border);
    }

    .result {
      margin-top: var(--space-6);
      padding: var(--space-6);
      border-radius: var(--radius-lg);
      background: rgba(1, 105, 111, 0.08);
      border: 1px solid rgba(1, 105, 111, 0.18);
    }

    .result h2 {
      margin: 0 0 var(--space-2);
      font-size: var(--text-lg);
    }

    .days {
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1;
      margin: 0 0 var(--space-3);
    }

    .status {
      margin: 0;
      line-height: 1.6;
    }

    .hint {
      margin-top: var(--space-4);
      font-size: var(--text-sm);
      color: var(--color-muted);
    }

    .success { color: var(--color-success); }
    .warning { color: var(--color-warning); }
    .error { color: var(--color-error); }

    @media (max-width: 560px) {
      .app { padding: var(--space-6); }
      .topbar { align-items: flex-start; }
      .actions > * { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>Compteur de jours</h1>
        <p class="muted">Choisissez une date de départ et une date d'événement, puis l'application calcule le nombre de jours restants.</p>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Changer le thème">🌙</button>
    </div>

    <form id="dateForm">
      <div class="field">
        <label for="startDate">Date de départ</label>
        <input id="startDate" type="date" required>
      </div>

      <div class="field">
        <label for="endDate">Date de l'événement</label>
        <input id="endDate" type="date" required>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Calculer</button>
        <button type="button" class="secondary" id="todayBtn">Mettre aujourd'hui</button>
      </div>
    </form>

    <section class="result" id="result" aria-live="polite">
      <h2>Résultat</h2>
      <p class="days" id="daysValue">--</p>
      <p class="status" id="statusText">Entrez deux dates pour afficher le nombre de jours.</p>
      <p class="hint">Exemple : aujourd'hui comme date de départ, puis la date de votre événement.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('dateForm');
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const daysValue = document.getElementById('daysValue');
    const statusText = document.getElementById('statusText');
    const todayBtn = document.getElementById('todayBtn');
    const resultBox = document.getElementById('result');
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;

    function formatDateForInput(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function diffInDays(startValue, endValue) {
      const start = new Date(startValue + 'T00:00:00');
      const end = new Date(endValue + 'T00:00:00');
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.round((end - start) / oneDay);
    }

    function renderResult(days) {
      daysValue.textContent = Math.abs(days);
      statusText.className = 'status';

      if (days > 0) {
        statusText.textContent = `Il reste ${days} jour${days > 1 ? 's' : ''} avant cette date.`;
        statusText.classList.add('success');
        resultBox.style.background = 'rgba(67, 122, 34, 0.08)';
        resultBox.style.borderColor = 'rgba(67, 122, 34, 0.18)';
      } else if (days === 0) {
        statusText.textContent = "C'est aujourd'hui.";
        statusText.classList.add('warning');
        resultBox.style.background = 'rgba(150, 66, 25, 0.08)';
        resultBox.style.borderColor = 'rgba(150, 66, 25, 0.18)';
      } else {
        statusText.textContent = `Cette date est passée depuis ${Math.abs(days)} jour${Math.abs(days) > 1 ? 's' : ''}.`;
        statusText.classList.add('error');
        resultBox.style.background = 'rgba(161, 44, 123, 0.08)';
        resultBox.style.borderColor = 'rgba(161, 44, 123, 0.18)';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!startDateInput.value || !endDateInput.value) {
        daysValue.textContent = '--';
        statusText.textContent = 'Veuillez remplir les deux dates.';
        statusText.className = 'status error';
        return;
      }

      const days = diffInDays(startDateInput.value, endDateInput.value);
      renderResult(days);
    });

    todayBtn.addEventListener('click', () => {
      startDateInput.value = formatDateForInput(new Date());
    });

    let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    function applyTheme() {
      root.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    themeToggle.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      applyTheme();
    });
    applyTheme();

    startDateInput.value = formatDateForInput(new Date());
  </script>
</body>
</html>
